<svg class="vz6" viewBox="0 0 760 364" width="100%" role="img" aria-label="Two of three cross-paper checks close; one does not" xmlns="http://www.w3.org/2000/svg"><style>.vz6{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz6{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz6{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz6 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz6 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz6 .sub{font-size:12px;fill:var(--sec)}.vz6 .lbl{font-size:11.5px;fill:var(--sec)}.vz6 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz6 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz6 .note{font-size:11px;fill:var(--mut)}.vz6 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz6 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz6 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz6 .edge{font-size:10.5px;fill:var(--mut)}.vz6 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz6 .tagN{font-size:10.5px;fill:var(--mut)}.vz6 .noden{font-size:10px;fill:var(--sec)}.vz6 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz6 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">Two of three cross-paper checks close; one does not</text><text x="12" y="40" class="sub" text-anchor="start">Closed-form predictions from the published aggregates — no fitted parameters.</text><line x1="196" y1="96" x2="196" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="196" y="274" class="tick" text-anchor="middle">0</text><line x1="253.5" y1="96" x2="253.5" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="253.5" y="274" class="tick" text-anchor="middle">5</text><line x1="311" y1="96" x2="311" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="311" y="274" class="tick" text-anchor="middle">10</text><line x1="368.5" y1="96" x2="368.5" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="368.5" y="274" class="tick" text-anchor="middle">15</text><line x1="426" y1="96" x2="426" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="426" y="274" class="tick" text-anchor="middle">20</text><line x1="483.5" y1="96" x2="483.5" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="483.5" y="274" class="tick" text-anchor="middle">25</text><line x1="541" y1="96" x2="541" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="541" y="274" class="tick" text-anchor="middle">30</text><line x1="598.5" y1="96" x2="598.5" y2="258" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="598.5" y="274" class="tick" text-anchor="middle">35</text><line x1="196" y1="258" x2="610" y2="258" stroke="var(--axs)" stroke-width="1" stroke-linecap="butt"/><text x="403" y="292" class="lbl" text-anchor="middle">value (units differ per row — see labels)</text><circle cx="536.4" cy="62" r="5" fill="var(--s1)"/><text x="547.4" y="66" class="key" text-anchor="start">observed</text><circle cx="449.6" cy="62" r="5" fill="var(--s3)"/><text x="460.6" y="66" class="key" text-anchor="start">predicted</text><line x1="221.2" y1="123" x2="254.7" y2="123" stroke="var(--s2)" stroke-width="3" stroke-linecap="round"/><circle cx="221.2" cy="123" r="6" fill="var(--s3)" stroke="var(--srf)" stroke-width="2"/><circle cx="254.7" cy="123" r="6" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="184" y="120" class="val" text-anchor="end">hiPSC arrested reservoir</text><text x="184" y="135" class="note" text-anchor="end">% mVenus⁺</text><text x="268.6" y="127" class="val" text-anchor="start">off by 2.32×</text><line x1="573.3" y1="177" x2="489.7" y2="177" stroke="var(--grd)" stroke-width="2" stroke-linecap="round"/><circle cx="573.3" cy="177" r="6" fill="var(--s3)" stroke="var(--srf)" stroke-width="2"/><circle cx="489.7" cy="177" r="6" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="184" y="174" class="val" text-anchor="end">mouse cumulative EdU</text><text x="184" y="189" class="note" text-anchor="end">% EdU⁺ nuclei</text><text x="587.3" y="181" class="val" text-anchor="start">within 1.28×</text><line x1="289.1" y1="231" x2="318" y2="231" stroke="var(--grd)" stroke-width="2" stroke-linecap="round"/><circle cx="289.1" cy="231" r="6" fill="var(--s3)" stroke="var(--srf)" stroke-width="2"/><circle cx="318" cy="231" r="6" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="184" y="228" class="val" text-anchor="end">fate-budget identity</text><text x="184" y="243" class="note" text-anchor="end">pp ΔEdU</text><text x="332" y="235" class="val" text-anchor="start">within 1.31×</text><text x="32" y="316" class="note" text-anchor="start">The hiPSC gap implies a chronically arrested pool of ≈2.9 pp of all cells — 2.1× the polyploidising fraction caught inside the</text><text x="32" y="330.5" class="note" text-anchor="start">72 h window — so the reported 24.5 h S/G2/M is a right-censored lower bound. The other two close with no fitted parameters.</text></svg>