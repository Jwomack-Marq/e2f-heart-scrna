<svg class="vz11" viewBox="0 0 1040 568" width="100%" role="img" aria-label="The engine: one state vector in, one derivative out" xmlns="http://www.w3.org/2000/svg"><style>.vz11{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz11{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz11{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz11 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz11 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz11 .sub{font-size:12px;fill:var(--sec)}.vz11 .lbl{font-size:11.5px;fill:var(--sec)}.vz11 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz11 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz11 .note{font-size:11px;fill:var(--mut)}.vz11 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz11 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz11 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz11 .edge{font-size:10.5px;fill:var(--mut)}.vz11 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz11 .tagN{font-size:10.5px;fill:var(--mut)}.vz11 .noden{font-size:10px;fill:var(--sec)}.vz11 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz11 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">The engine: one state vector in, one derivative out</text><text x="12" y="40" class="sub" text-anchor="start">Normalized-Hill logic-ODE (Kraeutler, Soltis &amp; Saucerman 2010). Orange marks the rule where both of this model&#x27;s structural bugs lived.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--sec)"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--s2)"/></marker></defs><rect x="24" y="108" width="118" height="96" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="83" y="129" class="boxttl" text-anchor="middle">state  Y</text><text x="83" y="150" class="boxln" text-anchor="middle">Y[i] ∈ [0,1]</text><text x="83" y="165" class="boxln" text-anchor="middle">one per species</text><text x="83" y="180" class="boxln" text-anchor="middle">55 here</text><line x1="148" y1="156" x2="196" y2="156" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><text x="172" y="149" class="edge" text-anchor="middle">read</text><rect x="202" y="108" width="288" height="96" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="346" y="129" class="boxttl" text-anchor="middle">per REACTION</text><text x="346" y="150" class="boxln" text-anchor="middle">act(x) = w·β·xⁿ/(Kⁿ+xⁿ)</text><text x="346" y="165" class="boxln" text-anchor="middle">inhib(x) = w − act(x)</text><text x="346" y="180" class="boxln" text-anchor="middle">AND:  ∏ vals / w^(k−1)</text><line x1="496" y1="156" x2="550" y2="156" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><text x="523" y="149" class="edge" text-anchor="middle">value</text><rect x="556" y="108" width="226" height="96" rx="8" fill="var(--bnd)" stroke="var(--s2)" stroke-width="1.5"/><text x="669" y="129" class="boxttl" text-anchor="middle">per NODE</text><text x="669" y="150" class="boxln" text-anchor="middle">weighted OR over every</text><text x="669" y="165" class="boxln" text-anchor="middle">reaction onto it:</text><text x="669" y="180" class="boxln" text-anchor="middle">d ← d + v − d·v</text><line x1="788" y1="156" x2="838" y2="156" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><text x="813" y="149" class="edge" text-anchor="middle">drive</text><rect x="844" y="108" width="172" height="96" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="930" y="129" class="boxttl" text-anchor="middle">per SPECIES</text><text x="930" y="150" class="boxln" text-anchor="middle">dY/dt =</text><text x="930" y="165" class="boxln" text-anchor="middle">(drive·Ymax − Y)/τ</text><rect x="202" y="244" width="288" height="62" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="346" y="265" class="boxttl" text-anchor="middle">(w, n, EC50)  →  β, K</text><text x="346" y="286" class="boxln" text-anchor="middle">β = (EC50ⁿ−1)/(2·EC50ⁿ−1)</text><text x="346" y="301" class="boxln" text-anchor="middle">K = (β−1)^(1/n)</text><line x1="346" y1="240" x2="346" y2="210" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><text x="202" y="326" class="tagN" text-anchor="start">these belong to the REACTION, not the reactant:</text><text x="202" y="341" class="tagN" text-anchor="start">one curve applies to all of its reactants</text><text x="202" y="362" class="tagA" text-anchor="start">guard: EC50ⁿ &lt; 0.5, else β flips sign</text><text x="844" y="226" class="tagN" text-anchor="start">knockdown:  Ymax → 0</text><text x="844" y="241" class="tagN" text-anchor="start">overexpress: hold Y = 1</text><text x="844" y="256" class="tagN" text-anchor="start">graded:  Ymax ×= f</text><rect x="556" y="244" width="264" height="62" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="688" y="265" class="boxttl" text-anchor="middle">output-only nodes stop here</text><text x="688" y="286" class="boxln" text-anchor="middle">y = drive·Ymax, algebraically</text><text x="688" y="301" class="boxln" text-anchor="middle">4 fates + 4 marker nodes</text><polyline points="818,166 818,238" fill="none" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="4 3"/><rect x="844" y="392" width="172" height="62" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="930" y="413" class="boxttl" text-anchor="middle">RK23 step</text><text x="930" y="434" class="boxln" text-anchor="middle">adaptive, embedded</text><text x="930" y="449" class="boxln" text-anchor="middle">3rd-order error</text><polyline points="976,310 976,388" fill="none" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><rect x="556" y="392" width="226" height="62" rx="8" fill="var(--bnd)" stroke="var(--axs)" stroke-width="1.5"/><text x="669" y="413" class="boxttl" text-anchor="middle">converged?</text><text x="669" y="434" class="boxln" text-anchor="middle">max |dY/dt| &lt; tol</text><text x="669" y="449" class="boxln" text-anchor="middle">else step again</text><line x1="838" y1="423" x2="788" y2="423" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><text x="813" y="416" class="edge" text-anchor="middle">y′</text><polyline points="550,423 83,423 83,210" fill="none" stroke="var(--sec)" stroke-width="1.6" marker-end="url(#arr)"/><text x="316.5" y="416" class="edge" text-anchor="middle">iterate</text><text x="24" y="490" class="tagA" text-anchor="start">① a low-weight OR&#x27;d reaction acts as a FLOOR</text><text x="42" y="506" class="tagN" text-anchor="start">flattened Ect2&#x27;s maturation response to 1.20×, against a measured 1.83×</text><text x="24" y="530" class="tagA" text-anchor="start">② OR can only ADD drive, so no route can be vetoed by another</text><text x="42" y="546" class="tagN" text-anchor="start">a second Midbody route bypassed the obligatory Ect2/RhoA arm entirely</text><polyline points="526,482 526,230 578,230 578,210" fill="none" stroke="var(--s2)" stroke-width="1.6" marker-end="url(#arrA)"/></svg>