<svg class="vz7" viewBox="0 0 700 392" width="100%" role="img" aria-label="Cycling fractions in this dataset are a sorting artefact" xmlns="http://www.w3.org/2000/svg"><style>.vz7{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz7{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz7{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz7 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz7 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz7 .sub{font-size:12px;fill:var(--sec)}.vz7 .lbl{font-size:11.5px;fill:var(--sec)}.vz7 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz7 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz7 .note{font-size:11px;fill:var(--mut)}.vz7 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz7 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz7 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz7 .edge{font-size:10.5px;fill:var(--mut)}.vz7 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz7 .tagN{font-size:10.5px;fill:var(--mut)}.vz7 .noden{font-size:10px;fill:var(--sec)}.vz7 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz7 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">Cycling fractions in this dataset are a sorting artefact</text><text x="12" y="40" class="sub" text-anchor="start">FACS-sorted scRNA-seq vs the in-vivo expectation from Baniol&#x27;s FUCCI imaging.</text><line x1="112" y1="276" x2="660" y2="276" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="104" y="280" class="tick" text-anchor="end">0</text><line x1="112" y1="240.8" x2="660" y2="240.8" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="104" y="244.8" class="tick" text-anchor="end">10</text><line x1="112" y1="205.6" x2="660" y2="205.6" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="104" y="209.6" class="tick" text-anchor="end">20</text><line x1="112" y1="170.4" x2="660" y2="170.4" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="104" y="174.4" class="tick" text-anchor="end">30</text><line x1="112" y1="135.2" x2="660" y2="135.2" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="104" y="139.2" class="tick" text-anchor="end">40</text><line x1="112" y1="100" x2="660" y2="100" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="104" y="104" class="tick" text-anchor="end">50</text><line x1="112" y1="100" x2="112" y2="276" stroke="var(--axs)" stroke-width="1" stroke-linecap="butt"/><text transform="translate(16,188) rotate(-90)" class="lbl" text-anchor="middle">% cycling cardiomyocytes</text><circle cx="521.6" cy="66" r="5" fill="var(--s3)"/><text x="532.6" y="70" class="key" text-anchor="start">in vivo (imaging)</text><circle cx="370" cy="66" r="5" fill="var(--s1)"/><text x="381" y="70" class="key" text-anchor="start">scRNA-seq (sorted)</text><rect x="198.4" y="162" width="66" height="114" rx="4" fill="var(--s1)"/><text x="231.4" y="153" class="val" text-anchor="middle">32.4%</text><rect x="266.4" y="161.6" width="66" height="114.4" rx="4" fill="var(--s3)"/><text x="299.4" y="152.6" class="val" text-anchor="middle">32.5%</text><text x="265.4" y="296" class="key" text-anchor="middle">P0</text><text x="265.4" y="312" class="note" text-anchor="middle">1.00× enriched</text><rect x="439.6" y="117.6" width="66" height="158.4" rx="4" fill="var(--s1)"/><text x="472.6" y="108.6" class="val" text-anchor="middle">45.0%</text><rect x="507.6" y="240.8" width="66" height="35.2" rx="4" fill="var(--s3)"/><line x1="507.6" y1="245.3" x2="573.6" y2="245.3" stroke="var(--pri)" stroke-width="1.5" stroke-linecap="round"/><text x="540.6" y="231.8" class="val" text-anchor="middle">8.7–10.0%</text><text x="506.6" y="296" class="key" text-anchor="middle">P7</text><text x="506.6" y="312" class="note" text-anchor="middle">4.5–5.2× enriched</text><text x="32" y="334" class="note" text-anchor="start">P0 is essentially unenriched; P7 is 4.5–5.2× enriched. So the cycling fraction rises from P0 to P7 in this dataset</text><text x="32" y="348.5" class="note" text-anchor="start">and falls in reality — it can never be used as a rate. Only within-group expression contrasts are valid here.</text></svg>