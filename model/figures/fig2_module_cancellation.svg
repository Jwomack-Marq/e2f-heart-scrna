<svg class="vz2" viewBox="0 0 760 336" width="100%" role="img" aria-label="Averaging cancels the one signal that matters" xmlns="http://www.w3.org/2000/svg"><style>.vz2{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz2{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz2{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz2 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz2 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz2 .sub{font-size:12px;fill:var(--sec)}.vz2 .lbl{font-size:11.5px;fill:var(--sec)}.vz2 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz2 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz2 .note{font-size:11px;fill:var(--mut)}.vz2 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz2 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz2 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz2 .edge{font-size:10.5px;fill:var(--mut)}.vz2 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz2 .tagN{font-size:10.5px;fill:var(--mut)}.vz2 .noden{font-size:10px;fill:var(--sec)}.vz2 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz2 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">Averaging cancels the one signal that matters</text><text x="12" y="40" class="sub" text-anchor="start">Module means in cycling ventricular cardiomyocytes (n=26 vs 63), ±1 SE.</text><line x1="186" y1="214.8" x2="628" y2="214.8" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 4"/><text x="634" y="218.8" class="tick" text-anchor="start">0</text><text x="240" y="282" class="key" text-anchor="middle">P0</text><text x="574" y="282" class="key" text-anchor="middle">P7</text><line x1="240" y1="98.9" x2="574" y2="110.2" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="240" y1="105.1" x2="240" y2="92.8" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round"/><circle cx="240" cy="98.9" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="228" y="102.9" class="val" text-anchor="end">+1.619</text><line x1="574" y1="114.1" x2="574" y2="106.3" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round"/><circle cx="574" cy="110.2" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="586" y="114.2" class="val" text-anchor="start">+1.462</text><text x="14" y="96.9" class="val" text-anchor="start">mitotic module</text><text x="14" y="110.9" class="note" text-anchor="start">13 genes</text><text x="634" y="114.2" class="val" text-anchor="start">p = 0.1291</text><line x1="240" y1="130.1" x2="574" y2="141.1" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round"/><line x1="240" y1="133.8" x2="240" y2="126.4" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round"/><circle cx="240" cy="130.1" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="228" y="134.1" class="val" text-anchor="end">+1.183</text><line x1="574" y1="143.6" x2="574" y2="138.5" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round"/><circle cx="574" cy="141.1" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="586" y="145.1" class="val" text-anchor="start">+1.030</text><text x="14" y="128.1" class="val" text-anchor="start">cytokinesis module</text><text x="14" y="142.1" class="note" text-anchor="start">12 genes</text><text x="634" y="145.1" class="val" text-anchor="start">p = 0.018</text><line x1="240" y1="246" x2="574" y2="245.6" stroke="var(--s3)" stroke-width="2.5" stroke-linecap="round"/><line x1="240" y1="249.2" x2="240" y2="242.8" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round"/><circle cx="240" cy="246" r="5.5" fill="var(--s3)" stroke="var(--srf)" stroke-width="2"/><text x="228" y="250" class="val" text-anchor="end">-0.436</text><line x1="574" y1="247.4" x2="574" y2="243.8" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round"/><circle cx="574" cy="245.6" r="5.5" fill="var(--s3)" stroke="var(--srf)" stroke-width="2"/><text x="586" y="249.6" class="val" text-anchor="start">-0.431</text><text x="14" y="244" class="val" text-anchor="start">difference index</text><text x="14" y="258" class="note" text-anchor="start">cyto − mito</text><text x="634" y="249.6" class="val" text-anchor="start">p = 0.9269</text><text x="32" y="306" class="note" text-anchor="start">Both modules fall together (0.871× and 0.903×), so their difference is flat (Δ = +0.005, p = 0.93). The sig_ploidy heuristic in</text><text x="32" y="320.5" class="note" text-anchor="start">build_signature_scores.R is a difference of exactly these two averages — so it cannot see the Ect2 signal at all.</text></svg>