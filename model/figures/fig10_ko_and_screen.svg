<svg class="vz10" viewBox="0 0 820 470" width="100%" role="img" aria-label="The lab&#x27;s own knockout, and what else the model says to try" xmlns="http://www.w3.org/2000/svg"><style>.vz10{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz10{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz10{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz10 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz10 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz10 .sub{font-size:12px;fill:var(--sec)}.vz10 .lbl{font-size:11.5px;fill:var(--sec)}.vz10 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz10 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz10 .note{font-size:11px;fill:var(--mut)}.vz10 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz10 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz10 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz10 .edge{font-size:10.5px;fill:var(--mut)}.vz10 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz10 .tagN{font-size:10.5px;fill:var(--mut)}.vz10 .noden{font-size:10px;fill:var(--sec)}.vz10 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz10 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">The lab&#x27;s own knockout, and what else the model says to try</text><text x="12" y="40" class="sub" text-anchor="start">In-silico double knockdown of E2F7/E2F8, and every node ranked by how much it converts cycling into division.</text><text x="156" y="74" class="key" text-anchor="start">E2F7 + E2F8 double knockdown</text><line x1="156" y1="100" x2="156" y2="312" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="156" y="326" class="tick" text-anchor="middle">0</text><line x1="228.9" y1="100" x2="228.9" y2="312" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="228.9" y="326" class="tick" text-anchor="middle">0.2</text><line x1="301.8" y1="100" x2="301.8" y2="312" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="301.8" y="326" class="tick" text-anchor="middle">0.4</text><text x="148" y="125.2" class="lbl" text-anchor="end">SPhase</text><rect x="156" y="112.2" width="58.3" height="8" rx="4" fill="var(--s1)"/><rect x="156" y="123.2" width="30.1" height="8" rx="4" fill="var(--s2)"/><text x="222.3" y="125.2" class="note" text-anchor="start">+0.160 / +0.082</text><text x="148" y="167.6" class="lbl" text-anchor="end">Ect2</text><rect x="156" y="154.6" width="163.2" height="8" rx="4" fill="var(--s1)"/><rect x="156" y="165.6" width="93.9" height="8" rx="4" fill="var(--s2)"/><text x="327.2" y="167.6" class="note" text-anchor="start">+0.448 / +0.258</text><text x="148" y="210" class="lbl" text-anchor="end">Division</text><rect x="156" y="197" width="39.1" height="8" rx="4" fill="var(--s1)"/><rect x="156" y="208" width="1.8" height="8" rx="4" fill="var(--s2)"/><text x="203.1" y="210" class="note" text-anchor="start">+0.107 / +0.005</text><text x="148" y="252.4" class="lbl" text-anchor="end">Binucleation</text><rect x="156" y="239.4" width="26.7" height="8" rx="4" fill="var(--s1)"/><rect x="156" y="250.4" width="17.6" height="8" rx="4" fill="var(--s2)"/><text x="190.7" y="252.4" class="note" text-anchor="start">+0.073 / +0.048</text><text x="148" y="294.8" class="lbl" text-anchor="end">Polyploidization</text><rect x="156" y="281.8" width="13" height="8" rx="4" fill="var(--s1)"/><rect x="156" y="292.8" width="11.3" height="8" rx="4" fill="var(--s2)"/><text x="177" y="294.8" class="note" text-anchor="start">+0.036 / +0.031</text><circle cx="264.8" cy="88" r="5" fill="var(--s2)"/><text x="275.8" y="92" class="key" text-anchor="start">P7 (M=0.55)</text><circle cx="163.6" cy="88" r="5" fill="var(--s1)"/><text x="174.6" y="92" class="key" text-anchor="start">P0 (M=0.30)</text><text x="420" y="74" class="key" text-anchor="start">top targets at P7, by conditional division share</text><text x="572" y="117.2" class="val" text-anchor="end">Midbody</text><text x="424" y="117.2" class="note" text-anchor="start">overexpress</text><rect x="580" y="108.2" width="145.2" height="10" rx="4" fill="var(--s3)"/><text x="733.2" y="117.2" class="note" text-anchor="start">+0.105</text><text x="572" y="143.8" class="val" text-anchor="end">cAMP</text><text x="424" y="143.8" class="note" text-anchor="start">knockdown</text><rect x="580" y="134.8" width="68.1" height="10" rx="4" fill="var(--s2)"/><text x="656.1" y="143.8" class="note" text-anchor="start">+0.049</text><text x="572" y="170.2" class="val" text-anchor="end">PKA</text><text x="424" y="170.2" class="note" text-anchor="start">knockdown</text><rect x="580" y="161.2" width="68.1" height="10" rx="4" fill="var(--s2)"/><text x="656.1" y="170.2" class="note" text-anchor="start">+0.049</text><text x="572" y="196.8" class="val" text-anchor="end">Ect2</text><text x="424" y="196.8" class="note" text-anchor="start">overexpress</text><rect x="580" y="187.8" width="51.2" height="10" rx="4" fill="var(--s3)"/><text x="639.2" y="196.8" class="note" text-anchor="start">+0.037</text><text x="572" y="223.2" class="val" text-anchor="end">RhoA</text><text x="424" y="223.2" class="note" text-anchor="start">overexpress</text><rect x="580" y="214.2" width="51.2" height="10" rx="4" fill="var(--s3)"/><text x="639.2" y="223.2" class="note" text-anchor="start">+0.037</text><text x="572" y="249.8" class="val" text-anchor="end">E2F8</text><text x="424" y="249.8" class="note" text-anchor="start">knockdown</text><rect x="580" y="240.8" width="10.1" height="10" rx="4" fill="var(--s2)"/><text x="598.1" y="249.8" class="note" text-anchor="start">+0.007</text><text x="572" y="276.2" class="val" text-anchor="end">E2F6</text><text x="424" y="276.2" class="note" text-anchor="start">knockdown</text><rect x="580" y="267.2" width="1" height="10" rx="4" fill="var(--s2)"/><text x="588.2" y="276.2" class="note" text-anchor="start">+0.000</text><text x="572" y="302.8" class="val" text-anchor="end">Anillin</text><text x="424" y="302.8" class="note" text-anchor="start">overexpress</text><rect x="580" y="293.8" width="1" height="10" rx="4" fill="var(--s3)"/><text x="588.1" y="302.8" class="note" text-anchor="start">+0.000</text><text x="32" y="364" class="note" text-anchor="start">The knockout&#x27;s pro-division effect is 22x larger at P0 than at P7 (+0.1073 vs +0.0049), even though it raises Ect2 substantially at both</text><text x="32" y="378.5" class="note" text-anchor="start">(+0.45 and +0.26) — the machinery goes up either way, but only at P0 is the rest of the context permissive enough to convert it. Scored</text><text x="32" y="393" class="note" text-anchor="start">like-for-like in hiPSC-CM, 12% of perturbations clear the hit bar against 6% in Murganti&#x27;s wet screen, and only 33% of those also raise</text><text x="32" y="407.5" class="note" text-anchor="start">the division share, against 33% surviving their validation — an entry-scored screen mostly finds things that do not help.</text></svg>