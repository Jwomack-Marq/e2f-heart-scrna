<svg class="vz1" viewBox="0 0 780 680" width="100%" role="img" aria-label="Ect2 is the only cytokinesis gene that beats the background drift" xmlns="http://www.w3.org/2000/svg"><style>.vz1{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz1{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz1{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz1 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz1 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz1 .sub{font-size:12px;fill:var(--sec)}.vz1 .lbl{font-size:11.5px;fill:var(--sec)}.vz1 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz1 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz1 .note{font-size:11px;fill:var(--mut)}.vz1 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz1 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz1 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz1 .edge{font-size:10.5px;fill:var(--mut)}.vz1 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz1 .tagN{font-size:10.5px;fill:var(--mut)}.vz1 .noden{font-size:10px;fill:var(--sec)}.vz1 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz1 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">Ect2 is the only cytokinesis gene that beats the background drift</text><text x="12" y="40" class="sub" text-anchor="start">P7/P0 ratio in cycling ventricular cardiomyocytes (n=26 vs 63). Grey band = genome-wide 5–95%.</text><rect x="201.4" y="96" width="581.9" height="484" rx="0" fill="var(--bnd)"/><line x1="483.9" y1="96" x2="483.9" y2="580" stroke="var(--axs)" stroke-width="2" stroke-linecap="butt" stroke-dasharray="2 4"/><text x="483.9" y="88" class="note" text-anchor="middle">genome-wide median 0.89</text><line x1="92" y1="96" x2="92" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="92" y="596" class="tick" text-anchor="middle">0.5</text><line x1="193.2" y1="96" x2="193.2" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="193.2" y="596" class="tick" text-anchor="middle">0.6</text><line x1="294.5" y1="96" x2="294.5" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="294.5" y="596" class="tick" text-anchor="middle">0.7</text><line x1="395.7" y1="96" x2="395.7" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="395.7" y="596" class="tick" text-anchor="middle">0.8</text><line x1="496.9" y1="96" x2="496.9" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="496.9" y="596" class="tick" text-anchor="middle">0.9</text><line x1="598.2" y1="96" x2="598.2" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="598.2" y="596" class="tick" text-anchor="middle">1</text><line x1="699.4" y1="96" x2="699.4" y2="580" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="699.4" y="596" class="tick" text-anchor="middle">1.1</text><line x1="92" y1="580" x2="750" y2="580" stroke="var(--axs)" stroke-width="1" stroke-linecap="butt"/><text x="421" y="614" class="lbl" text-anchor="middle">P7 / P0 expression ratio</text><circle cx="683.6" cy="62" r="5" fill="var(--s2)"/><text x="694.6" y="66" class="key" text-anchor="start">mitotic</text><circle cx="582.4" cy="62" r="5" fill="var(--s1)"/><text x="593.4" y="66" class="key" text-anchor="start">cytokinesis</text><circle cx="139.4" cy="105.7" r="7" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="109.7" class="val" text-anchor="end">Ect2</text><text x="155.4" y="109.7" class="val" text-anchor="start">0.55×  ·  3rd pctile</text><circle cx="332.5" cy="125" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="129" class="lbl" text-anchor="end">Cit</text><circle cx="380.8" cy="144.4" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="148.4" class="lbl" text-anchor="end">Ccnb1</text><circle cx="403.5" cy="163.8" r="7" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="167.8" class="val" text-anchor="end">Rhoa</text><text x="419.5" y="167.8" class="val" text-anchor="start">0.81×  ·  29th pctile</text><circle cx="404.9" cy="183.1" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="187.1" class="lbl" text-anchor="end">Cdc20</text><circle cx="412.5" cy="202.5" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="206.5" class="lbl" text-anchor="end">Incenp</text><circle cx="441.4" cy="221.8" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="225.8" class="lbl" text-anchor="end">Cenpe</text><circle cx="451.3" cy="241.2" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="245.2" class="lbl" text-anchor="end">Nusap1</text><circle cx="464.2" cy="260.6" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="264.6" class="lbl" text-anchor="end">Kif23</text><circle cx="473.1" cy="279.9" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="283.9" class="lbl" text-anchor="end">Cep55</text><circle cx="480.1" cy="299.3" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="303.3" class="lbl" text-anchor="end">Cdca8</text><circle cx="481.4" cy="318.6" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="322.6" class="lbl" text-anchor="end">Ube2c</text><circle cx="492.8" cy="338" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="342" class="lbl" text-anchor="end">Racgap1</text><circle cx="503" cy="357.4" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="361.4" class="lbl" text-anchor="end">Anln</text><circle cx="505.5" cy="376.7" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="380.7" class="lbl" text-anchor="end">Cenpa</text><circle cx="514.4" cy="396.1" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="400.1" class="lbl" text-anchor="end">Tpx2</text><circle cx="521.5" cy="415.4" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="419.4" class="lbl" text-anchor="end">Bub1</text><circle cx="524.3" cy="434.8" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="438.8" class="lbl" text-anchor="end">Aurka</text><circle cx="528.5" cy="454.2" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="458.2" class="lbl" text-anchor="end">Cenpf</text><circle cx="538.9" cy="473.5" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="477.5" class="lbl" text-anchor="end">Cdk1</text><circle cx="560.1" cy="492.9" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="496.9" class="lbl" text-anchor="end">Prc1</text><circle cx="564.8" cy="512.2" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="516.2" class="lbl" text-anchor="end">Top2a</text><circle cx="566.8" cy="531.6" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="535.6" class="lbl" text-anchor="end">Kif20b</text><circle cx="571.4" cy="551" r="5.5" fill="var(--s2)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="555" class="lbl" text-anchor="end">Plk1</text><circle cx="707.5" cy="570.3" r="5.5" fill="var(--s1)" stroke="var(--srf)" stroke-width="2"/><text x="82" y="574.3" class="lbl" text-anchor="end">Aurkb</text><text x="32" y="638" class="note" text-anchor="start">Larger marks clear Bonferroni (p &lt; 0.0020). Only Ect2 is also a genome-wide outlier — RhoA is significant by t-test but sits at</text><text x="32" y="652.5" class="note" text-anchor="start">the 29th percentile of background drift, so it is not specific.</text></svg>