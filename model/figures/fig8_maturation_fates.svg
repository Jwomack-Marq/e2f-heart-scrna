width="1" stroke-linecap="butt" stroke-dasharray="2 4"/><text x="234.9" y="88" class="note" text-anchor="middle">M = 0.30</text><line x1="393.8" y1="96" x2="393.8" y2="324" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 4"/><text x="393.8" y="88" class="note" text-anchor="middle">M = 0.55</text><text x="32" y="382" class="note" text-anchor="start">Along this axis the cycling flux moves from binucleation into polyploidization, crossing over near M = 0.62, while division&#x27;s</text><text x="32" y="396.5" class="note" text-anchor="start">share stays under 3% throughout. Division is low even at low M here because this sweep holds mechanical load and beta-adrenergic</text><text x="32" y="411" class="note" text-anchor="start">tone at their in-vivo values; the hiPSC-CM context reaches a 53% division share because it differs in those too. That is the</text><text x="32" y="425.5" class="note" text-anchor="start">two-factor point — maturation alone does not set the outcome.</text></svg>