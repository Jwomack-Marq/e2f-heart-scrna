ound"/><line x1="139.6" y1="131.2" x2="171.3" y2="131.4" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="171.3" y1="131.4" x2="203.1" y2="132.7" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="203.1" y1="132.7" x2="234.9" y2="135.6" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="234.9" y1="135.6" x2="266.7" y2="140.6" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="266.7" y1="140.6" x2="298.4" y2="148.4" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="298.4" y1="148.4" x2="330.2" y2="160.1" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="330.2" y1="160.1" x2="362" y2="176.7" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="362" y1="176.7" x2="393.8" y2="199.4" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="393.8" y1="199.4" x2="425.6" y2="228" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="425.6" y1="228" x2="457.3" y2="259.6" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="457.3" y1="259.6" x2="489.1" y2="288.3" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="489.1" y1="288.3" x2="520.9" y2="308.3" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="520.9" y1="308.3" x2="552.7" y2="318.6" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="552.7" y1="318.6" x2="584.4" y2="322.5" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="584.4" y1="322.5" x2="616.2" y2="323.6" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><line x1="616.2" y1="323.6" x2="648" y2="323.9" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round"/><text x="658" y="327.9" class="val" text-anchor="start">Binucleation</text><line x1="76" y1="294" x2="107.8" y2="293.5" stroke="var(--s3)" stroke-width="2.5" stroke-linecap="round"/><line x1="107.8" y1="293.5" x