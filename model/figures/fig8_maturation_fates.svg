<svg class="vz8" viewBox="0 0 780 430" width="100%" role="img" aria-label="Entry is necessary but not sufficient" xmlns="http://www.w3.org/2000/svg"><style>.vz8{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz8{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz8{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz8 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz8 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz8 .sub{font-size:12px;fill:var(--sec)}.vz8 .lbl{font-size:11.5px;fill:var(--sec)}.vz8 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz8 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz8 .note{font-size:11px;fill:var(--mut)}.vz8 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz8 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz8 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz8 .edge{font-size:10.5px;fill:var(--mut)}.vz8 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz8 .tagN{font-size:10.5px;fill:var(--mut)}.vz8 .noden{font-size:10px;fill:var(--sec)}.vz8 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz8 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">Entry is necessary but not sufficient</text><text x="12" y="40" class="sub" text-anchor="start">cmfate model. ONLY the maturation coordinate is swept — every other input is held at the in-vivo P1 setting.</text><line x1="76" y1="324" x2="648" y2="324" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="68" y="328" class="tick" text-anchor="end">0</text><line x1="76" y1="267" x2="648" y2="267" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="68" y="271" class="tick" text-anchor="end">0.25</text><line x1="76" y1="210" x2="648" y2="210" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="68" y="214" class="tick" text-anchor="end">0.5</text><line x1="76" y1="153" x2="648" y2="153" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="68" y="157" class="tick" text-anchor="end">0.75</text><line x1="76" y1="96" x2="648" y2="96" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="68" y="100" class="tick" text-anchor="end">1</text><line x1="76" y1="96" x2="76" y2="324" stroke="var(--axs)" stroke-width="1" stroke-linecap="butt"/><text transform="translate(16,210) rotate(-90)" class="lbl" text-anchor="middle">share of cycling cells</text><text x="171.3" y="340" class="tick" text-anchor="middle">0.2</text><text x="298.4" y="340" class="tick" text-anchor="middle">0.4</text><text x="425.6" y="340" class="tick" text-anchor="middle">0.6</text><text x="552.7" y="340" class="tick" text-anchor="middle">0.8</text><text x="362" y="358" class="lbl" text-anchor="middle">maturation index M</text><circle cx="516.8" cy="62" r="5" fill="var(--s3)"/><text x="527.8" y="66" class="key" text-anchor="start">polyploidization</text><circle cx="408.4" cy="62" r="5" fill="var(--s2)"/><text x="419.4" y="66" class="key" text-anchor="start">binucleation</text><circle cx="328.8" cy="62" r="5" fill="var(--s1)"/><text x="339.8" y="66" class="key" text-anchor="start">division</text><line x1="76" y1="317.4" x2="107.8" y2="318.8" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round"/><line x1="107.8" y1="318.8" x2="139.6" y2="320.2" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round"/><line x1="139.6" y1="320.2"