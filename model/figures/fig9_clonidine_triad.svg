<svg class="vz9" viewBox="0 0 840 396" width="100%" role="img" aria-label="One drug, three contexts, three outcomes" xmlns="http://www.w3.org/2000/svg"><style>.vz9{--srf:#fcfcfb;--pri:#0b0b0b;--sec:#52514e;--mut:#898781;--grd:#e1e0d9;--axs:#c3c2b7;--bnd:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .vz9{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}:root[data-theme="dark"] .vz9{--srf:#1a1a19;--pri:#ffffff;--sec:#c3c2b7;--mut:#898781;--grd:#2c2c2a;--axs:#383835;--bnd:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70}.vz9 text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.vz9 .ttl{font-size:14.5px;font-weight:650;fill:var(--pri)}.vz9 .sub{font-size:12px;fill:var(--sec)}.vz9 .lbl{font-size:11.5px;fill:var(--sec)}.vz9 .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}.vz9 .val{font-size:11px;font-weight:620;fill:var(--pri);font-variant-numeric:tabular-nums}.vz9 .note{font-size:11px;fill:var(--mut)}.vz9 .key{font-size:11.5px;font-weight:600;fill:var(--pri)}.vz9 .boxttl{font-size:12.5px;font-weight:650;fill:var(--pri)}.vz9 .boxln{font-size:11px;fill:var(--sec);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.vz9 .edge{font-size:10.5px;fill:var(--mut)}.vz9 .tagA{font-size:10.5px;font-weight:620;fill:var(--s2)}.vz9 .tagN{font-size:10.5px;fill:var(--mut)}.vz9 .noden{font-size:10px;fill:var(--sec)}.vz9 .nodeb{font-size:10px;font-weight:650;fill:var(--pri)}.vz9 .colttl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;fill:var(--mut)}</style><rect width="100%" height="100%" fill="var(--srf)"/><text x="12" y="22" class="ttl" text-anchor="start">One drug, three contexts, three outcomes</text><text x="12" y="40" class="sub" text-anchor="start">Change in each fate under clonidine. The model is calibrated at the hiPSC context only; the other two are held out.</text><line x1="244.3" y1="104" x2="244.3" y2="300" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="244.3" y="316" class="tick" text-anchor="middle">0</text><line x1="351.2" y1="104" x2="351.2" y2="300" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="351.2" y="316" class="tick" text-anchor="middle">0.02</text><line x1="458.1" y1="104" x2="458.1" y2="300" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="458.1" y="316" class="tick" text-anchor="middle">0.04</text><line x1="565" y1="104" x2="565" y2="300" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="565" y="316" class="tick" text-anchor="middle">0.06</text><line x1="196" y1="300" x2="800" y2="300" stroke="var(--axs)" stroke-width="1" stroke-linecap="butt"/><text x="498" y="334" class="lbl" text-anchor="middle">change in fate fraction under clonidine</text><circle cx="668.8" cy="70" r="5" fill="var(--s3)"/><text x="679.8" y="74" class="key" text-anchor="start">polyploidization</text><circle cx="560.4" cy="70" r="5" fill="var(--s2)"/><text x="571.4" y="74" class="key" text-anchor="start">binucleation</text><circle cx="480.8" cy="70" r="5" fill="var(--s1)"/><text x="491.8" y="74" class="key" text-anchor="start">division</text><line x1="244.3" y1="104" x2="244.3" y2="300" stroke="var(--axs)" stroke-width="1" stroke-linecap="butt"/><text x="184" y="124" class="val" text-anchor="end">hiPSC-CM</text><text x="184" y="139" class="note" text-anchor="end">M = 0.12  ·  in vitro</text><rect x="244.3" y="113.5" width="410.8" height="9" rx="4" fill="var(--s1)"/><rect x="244.3" y="126.5" width="29.4" height="9" rx="4" fill="var(--s2)"/><rect x="244.3" y="139.5" width="74.7" height="9" rx="4" fill="var(--s3)"/><text x="667.1" y="131" class="val" text-anchor="start">Division OK</text><text x="184" y="189.3" class="val" text-anchor="end">Mouse neonatal CM, in vitro</text><text x="184" y="204.3" class="note" text-anchor="end">M = 0.50  ·  in vitro</text><rect x="244.3" y="178.8" width="8.3" height="9" rx="4" fill="var(--s1)"/><rect x="244.3" y="191.8" width="21.1" height="9" rx="4" fill="var(--s2)"/><rect x="244.3" y="204.8" width="50.2" height="9" rx="4" fill="var(--s3)"/><text x="306.5" y="196.3" class="val" text-anchor="start">Polyploidization OK</text><line x1="196" y1="169.3" x2="800" y2="169.3" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="184" y="254.7" class="val" text-anchor="end">Neonatal mouse, in vivo</text><text x="184" y="269.7" class="note" text-anchor="end">M = 0.50  ·  in vivo</text><rect x="244.3" y="244.2" width="87.8" height="9" rx="4" fill="var(--s1)"/><rect x="244.3" y="257.2" width="229" height="9" rx="4" fill="var(--s2)"/><rect x="244.3" y="270.2" width="131.3" height="9" rx="4" fill="var(--s3)"/><text x="485.3" y="261.7" class="val" text-anchor="start">Binucleation OK</text><line x1="196" y1="234.7" x2="800" y2="234.7" stroke="var(--grd)" stroke-width="1" stroke-linecap="butt"/><text x="32" y="358" class="note" text-anchor="start">3 of 3 dominant fates correct, from one calibration and one input change per context. What the model gets wrong is the MAGNITUDE of the entry</text><text x="32" y="372.5" class="note" text-anchor="start">response: 1.7x at hiPSC against an observed 2.4x, but 6x and 9x in the two mature contexts against observed 2.1x and 1.5x. Clonidine&#x27;s</text><text x="32" y="387" class="note" text-anchor="start">leverage on entry scales with baseline PKA, which the model ties to beta-adrenergic tone.</text></svg>